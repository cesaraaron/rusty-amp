name        = "Van Halen — Brown Sound"
description = "The 'brown' lead voice: a dimed Plexi with a Tube Screamer, a Phase 90-style phaser and Echoplex-style slapback — saturated, harmonically rich and warm, the sound of the first album's leads."

[noise_gate]
enabled   = true
threshold = 0.18
release   = 0.32

[compressor]
enabled = false
sustain = 0.40
attack  = 0.30
level   = 0.50

[fuzz]
enabled = false
type    = 0.0
fuzz    = 0.50
tone    = 0.50
level   = 0.60

# ── Tube Screamer ─────────────────────────────────────────────────────────────
# A clean-ish boost to push the Plexi's front end harder without adding its own
# distortion.
[tube_screamer]
enabled = true
drive = 0.14
tone  = 0.58
level = 0.80

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Low-mids pushed gently for the "brown" warmth, top left open.
[preamp_eq]
enabled = true
low  = 0.48
mid  = 0.58
high = 0.58

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# The Plexi dimed and slightly under-volted in spirit: maximum channel volume so
# the power section compresses into that smooth, singing sustain.
[amp]
model  = "plexi"
gain   = 0.90
bass   = 0.54
mid    = 0.60
treble = 0.60
presence = 0.56

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenbacks with a ribbon blend — a touch warmer than the rhythm setting.
[cabinet]
model     = "marshall"
mic_pos   = 0.52
mic_blend = 0.34
mic_room  = 0.16

[eq]
enabled = true
low  = 0.46
mid  = 0.56
high = 0.56

[chorus]
enabled = false
rate  = 0.22
depth = 0.40
mix   = 0.0

[flanger]
enabled  = false
rate     = 0.20
depth    = 0.30
feedback = 0.20
mix      = 0.0

# ── Phaser ────────────────────────────────────────────────────────────────────
# A gentle Phase 90-style phaser movement under the lead.
[phaser]
enabled  = true
rate     = 0.26
depth    = 0.45
feedback = 0.28
mix      = 0.35

# ── Delay ─────────────────────────────────────────────────────────────────────
# Echoplex tape slapback to thicken the lead.
[delay]
enabled  = true
type     = 1.0
time     = 0.24
feedback = 0.20
mix      = 0.18

# ── Reverb ────────────────────────────────────────────────────────────────────
# A small warm room, low in the mix.
[reverb]
enabled = true
room = 0.38
damp = 0.52
mix  = 0.14
