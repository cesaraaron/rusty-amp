name        = "AC/DC — Back in Black"
description = "Angus's rhythm crunch: guitar straight into a cranked Plexi and Greenbacks — no pedals, just the amp's power-section grind. Tight, dry and mid-forward."

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow — the tone is dry but the gated stops between chords must ring.
[noise_gate]
enabled   = true
threshold = 0.10
release   = 0.44

[compressor]
enabled = false
sustain = 0.40
attack  = 0.30
level   = 0.50

# No fuzz, no overdrive: the Plexi alone carries the gain.
[fuzz]
enabled = false
type    = 0.0
fuzz    = 0.50
tone    = 0.50
level   = 0.60

[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Mids up, lows tightened and a little top rolled off — the dry, woody AC/DC bite.
[preamp_eq]
enabled = true
low  = 0.42
mid  = 0.64
high = 0.50

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# Marshall Super Lead "Plexi" pushed hard on the channel volume: the power amp's
# compression and grind, not preamp distortion, is the whole sound.
[amp]
model  = "plexi"
gain   = 0.68
bass   = 0.44
mid    = 0.62
treble = 0.56
presence = 0.50

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenbacks just off-axis with very little room — dry and immediate, as on the
# record.
[cabinet]
model     = "marshall"
mic_pos   = 0.52
mic_blend = 0.22
mic_room  = 0.14

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# A final mid-forward shaping with the lows tucked for the tight rhythm chug.
[eq]
enabled = true
low  = 0.42
mid  = 0.58
high = 0.52

[chorus]
enabled = false
rate  = 0.22
depth = 0.40
mix   = 0.0

[flanger]
enabled  = false
rate     = 0.20
depth    = 0.30
feedback = 0.20
mix      = 0.0

[phaser]
enabled  = false
rate     = 0.28
depth    = 0.50
feedback = 0.30
mix      = 0.0

# ── Delay ─────────────────────────────────────────────────────────────────────
# Off — the whole point of the tone is that there is nothing between the guitar
# and the amp.
[delay]
enabled  = false
type     = 0.0
time     = 0.30
feedback = 0.28
mix      = 0.0

# ── Reverb ────────────────────────────────────────────────────────────────────
# A short room, barely there — just enough to place the cab.
[reverb]
enabled = true
room = 0.30
damp = 0.58
mix  = 0.10
