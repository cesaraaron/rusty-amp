name        = "Pink Floyd — Comfortably Numb (Solo 1)"
description = "The first solo: a singing, glassy lead — a mild Ram's-Head Big Muff for warmth, Dyna-Comp squeeze, a hint of Electric Mistress, and a long Echorec repeat. Bright and vocal, never a fuzz wall."

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow: the Muff's hiss is real, but a fading bend has to ring out.
[noise_gate]
enabled   = true
threshold = 0.10
release   = 0.45

# ── Compressor ────────────────────────────────────────────────────────────────
# Gilmour's always-on Dyna Comp: evens the picking and holds the note up so the
# lead sings, without squashing the dynamics that give it life.
[compressor]
enabled = true
sustain = 0.52
attack  = 0.36
level   = 0.52

# ── Big Muff (Fuzz) ───────────────────────────────────────────────────────────
# Barely a wall here — the first solo is mostly clean amp with the Muff adding
# warmth and sustain under the note. A bright tone keeps it from turning to wool.
[fuzz]
enabled = true
fuzz  = 0.40
tone  = 0.68
level = 0.50

# TS off — the Muff and the amp do the work.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Shapes what the amp clips: lows trimmed so the low strings stay clear (the old
# mud), mids lifted for the vocal vowel, top left open and glassy.
[preamp_eq]
enabled = true
low  = 0.42
mid  = 0.60
high = 0.54

# ── Amp ───────────────────────────────────────────────────────────────────────
# Marshall as a Hiwatt DR103 stand-in at modest gain: enough to bloom and sing,
# with headroom so the Muff is a voice, not the whole sound. Bass kept low so the
# low end stays tight instead of booming.
[amp]
model  = "marshall"
gain   = 0.34
bass   = 0.42
mid    = 0.60
treble = 0.62
presence = 0.56
master = 0.58

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenbacks near on-axis with a light ribbon blend — warm but present, with a
# little room for depth. Tight bass and no heavy ribbon keeps it out of the fog.
[cabinet]
model     = "marshall"
mic_pos   = 0.50
mic_blend = 0.25
mic_room  = 0.28

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Gentle final shaping: lows tucked, mids reinforced, a breath of air on top.
[eq]
enabled = true
low  = 0.42
mid  = 0.58
high = 0.56

# ── Chorus ────────────────────────────────────────────────────────────────────
# The Electric Mistress shimmer: shallow and slow, a halo around the note rather
# than a wash (mix 0.5 would be "classic chorus"; this is well under that).
[chorus]
enabled = true
rate  = 0.18
depth = 0.35
mix   = 0.16

# ── Delay ─────────────────────────────────────────────────────────────────────
# Echorec repeat: a long ~380 ms echo sitting behind the phrase. Low feedback and
# mix keep it a dimension, not a fog.
[delay]
enabled  = true
time     = 0.76
feedback = 0.30
mix      = 0.22

# ── Reverb ────────────────────────────────────────────────────────────────────
# A medium, fairly damped room — depth without smearing the articulation.
[reverb]
enabled = true
room = 0.45
damp = 0.50
mix  = 0.16
