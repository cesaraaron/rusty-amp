name        = "Pink Floyd — Time (Intro / Verse / Chorus)"
description = "The Dark Side rhythm tone shared by the intro riff, verses and chorus: a clean-ish Hiwatt DR103 and Fane WEM 4×12, a touch of Fuzz Face fur, the Uni-Vibe swirl and heavy dotted-eighth Echorec delay."

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow: the delayed repeats and the vibe tail have to ring out.
[noise_gate]
enabled   = true
threshold = 0.08
release   = 0.45

# ── Compressor ────────────────────────────────────────────────────────────────
# Gilmour's always-on Dyna Comp: evens the arpeggios and holds the sustained
# chords, without squashing the dynamics.
[compressor]
enabled = true
sustain = 0.45
attack  = 0.30
level   = 0.52

# ── Fuzz Face ─────────────────────────────────────────────────────────────────
# Barely on — just the fur and mid-rich edge of a Fuzz Face with the guitar
# volume backed off, not a saturated wall. type 1 = Fuzz Face.
[fuzz]
enabled = true
type    = 1.0   # 0 = Big Muff, 1 = Fuzz Face
fuzz    = 0.25
tone    = 0.62
level   = 0.50

[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Lows tucked, mids lifted for the vocal body, top left open.
[preamp_eq]
enabled = true
low  = 0.44
mid  = 0.58
high = 0.55

# ── Uni-Vibe ──────────────────────────────────────────────────────────────────
# The DSOTM throb under the chords — subtle, so it reads as movement, not wobble.
[uni_vibe]
enabled = true
rate    = 0.24
depth   = 0.40
mix     = 0.30
mode    = 0.0   # 0 = chorus, 1 = vibrato

# ── Amp ───────────────────────────────────────────────────────────────────────
# Clean-ish Hiwatt DR103 — the amp stays clean and the pedals colour it, exactly
# as on the record. A touch more gain than the Numb solos for a hint of edge.
[amp]
model  = "hiwatt"
gain   = 0.40
bass   = 0.46
mid    = 0.58
treble = 0.62
presence = 0.55
master = 0.60

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos — bright and open, with a little room for depth.
[cabinet]
model     = "wem"
mic_pos   = 0.50
mic_blend = 0.20
mic_room  = 0.30

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Gentle final shaping: lows tucked, mids reinforced, a breath of air on top.
[eq]
enabled = true
low  = 0.44
mid  = 0.56
high = 0.55

# Chorus off — the Uni-Vibe carries the modulation.
[chorus]
enabled = false
rate  = 0.20
depth = 0.40
mix   = 0.0

[flanger]
enabled  = false
rate     = 0.18
depth    = 0.30
feedback = 0.20
mix      = 0.0

# ── Delay ─────────────────────────────────────────────────────────────────────
# The dotted-eighth Echorec figure (~375 ms) that defines the intro and verses —
# present and rhythmic, held below the point of washing the chords together.
[delay]
enabled  = true
time     = 0.75
feedback = 0.35
mix      = 0.26

# ── Reverb ────────────────────────────────────────────────────────────────────
# A medium room with a little more depth than the solo — space without fog.
[reverb]
enabled = true
room = 0.50
damp = 0.50
mix  = 0.18
