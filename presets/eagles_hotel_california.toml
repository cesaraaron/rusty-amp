name        = "Eagles — Hotel California"
description = "Felton-green Fender-style clean: glassy twin-voice arpeggios, gentle squeeze, shimmer of chorus and hall. Fingerpick the intro."

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Barely there — a clean tone's noise floor is tiny; never choke the 12-string decay.
[noise_gate]
enabled   = true
threshold = 0.07
release   = 0.50   # very slow — arpeggios ring out fully

# ── Compressor ────────────────────────────────────────────────────────────────
# The Nashville clean secret: even, bell-like notes with soft attack.
[compressor]
enabled = true
sustain = 0.48
attack  = 0.42   # lets the finger attack chime through
level   = 0.55

[fuzz]
enabled = false
fuzz  = 0.50
tone  = 0.50
level = 0.60

# TS off — this preset never breaks up.
[tube_screamer]
enabled = false
drive = 0.25
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Amp ───────────────────────────────────────────────────────────────────────
# Marshall at its cleanest standing in for a Twin/Deluxe: edge-of-glass gain,
# mids up for the vocal arpeggio voice, sparkling but never harsh top.
[amp]
model  = "marshall"
gain   = 0.20   # glass clean — chime, no grit
bass   = 0.48
mid    = 0.58   # vocal mids — the Hotel melody sits here
treble = 0.58
presence = 0.45
master = 0.62

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenbacks voiced warm and silky: off-axis mic, ribbon blend, real room.
# (Swap in a Jensen-loaded Twin IR via I for the full California shimmer.)
[cabinet]
model     = "marshall"
mic_pos   = 0.40   # off-axis — rounded, no pick spit
mic_blend = 0.40   # ribbon silk on top
mic_room  = 0.30   # warm studio air

[eq]
enabled = true
low  = 0.46   # keep the low strings piano-clear
mid  = 0.52
high = 0.56   # a breath of 12-string air

# ── Chorus ────────────────────────────────────────────────────────────────────
# The doubling shimmer on the intro arpeggios.
[chorus]
enabled  = true
rate     = 0.22
depth    = 0.45
mix      = 0.28

# ── Delay ─────────────────────────────────────────────────────────────────────
# Short, quiet doubling slap for depth — never an audible echo.
[delay]
enabled  = true
time     = 0.30   # ~150 ms doubling
feedback = 0.20
mix      = 0.14

[reverb]
enabled = true
room = 0.55
damp = 0.55
mix  = 0.24
