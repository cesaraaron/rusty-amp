name        = "Led Zeppelin — Stairway to Heaven (Solo)"
description = "Page's solo: a cranked small-amp crunch — bright, mid-forward and singing, with a touch of room. Not high gain; the pick bite and the bend are the point."

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light — a medium-gain crunch, and the solo's quiet pickup-roll runs must not be
# clamped.
[noise_gate]
enabled   = true
threshold = 0.12
release   = 0.36

# ── Compressor ────────────────────────────────────────────────────────────────
# Only a whisper of compression for sustain. Page's tone is dynamic — too much
# squeeze and the light-and-shade of the solo disappears.
[compressor]
enabled = true
sustain = 0.30
attack  = 0.45
level   = 0.52

[fuzz]
enabled = false
fuzz  = 0.50
tone  = 0.50
level = 0.60

# ── Tube Screamer ─────────────────────────────────────────────────────────────
# A light boost standing in for a small amp pushed hard: more gain and mid push,
# not more distortion.
[tube_screamer]
enabled = true
drive = 0.22
tone  = 0.58
level = 0.66

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Mids up for the vocal Page lead voice, lows trimmed so chords stay tight, top
# open for the Tele/Les Paul bite.
[preamp_eq]
enabled = true
low  = 0.44
mid  = 0.60
high = 0.56

# ── Amp ───────────────────────────────────────────────────────────────────────
# Cranked-Marshall crunch as the stand-in for Page's small amp working hard:
# medium gain, strong mids, bright top. Enough to sing, far from metal.
[amp]
model  = "marshall"
gain   = 0.50
bass   = 0.44
mid    = 0.62
treble = 0.62
presence = 0.58
master = 0.58

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenbacks near on-axis with a light ribbon and just a little room — immediate
# and present, the way a close-mic'd small combo sits.
[cabinet]
model     = "marshall"
mic_pos   = 0.56
mic_blend = 0.18
mic_room  = 0.24

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# A mid-forward finish with the lows tucked and a little brightness on top.
[eq]
enabled = true
low  = 0.44
mid  = 0.58
high = 0.56

# ── Delay ─────────────────────────────────────────────────────────────────────
# A short Echoplex-style slap (~130 ms), barely there — it thickens the single
# note without turning into an audible echo.
[delay]
enabled  = true
time     = 0.26
feedback = 0.18
mix      = 0.14

# ── Reverb ────────────────────────────────────────────────────────────────────
# A small, damped room — enough to place the amp in a space, not a hall.
[reverb]
enabled = true
room = 0.38
damp = 0.52
mix  = 0.14
