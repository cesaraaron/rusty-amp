name        = "Van Halen — Eruption"
description = "Brown-sound fire: dimed Plexi-style Marshall, Phase 90 swirl, Echoplex slap and room. Two-hand tap at your own risk."

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Tight enough to mute the dimed-amp hiss between tapped phrases.
[noise_gate]
enabled   = true
threshold = 0.18
release   = 0.28

[compressor]
enabled = false
sustain = 0.35
attack  = 0.40
level   = 0.50

[fuzz]
enabled = false
fuzz  = 0.50
tone  = 0.50
level = 0.60

# ── Tube Screamer ─────────────────────────────────────────────────────────────
# Light push standing in for the Echoplex preamp + Variac sag drive.
[tube_screamer]
enabled = true
drive = 0.30
tone  = 0.62
level = 0.82

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Amp ───────────────────────────────────────────────────────────────────────
# Everything on 10 (almost): maximum preamp grind with mids cranked — the
# brown sound is fat and vocal, never scooped. Presence high for the
# pick-harmonic scream.
[amp]
model  = "marshall"
gain   = 0.88   # dimed — saturation for days
bass   = 0.60   # full thump under the tapping
mid    = 0.66   # vocal mids — the brown-sound roar
treble = 0.72
presence = 0.66
master = 0.72   # power-amp roar

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenbacks on-axis for maximum scream and pick attack.
[cabinet]
model     = "marshall"
mic_pos   = 0.60   # on-axis lean — aggressive, screaming top
mic_blend = 0.08   # SM57 attack
mic_room  = 0.14   # Sunset Sound room, just a taste

[eq]
enabled = false
low  = 0.50
mid  = 0.50
high = 0.50

# ── Phaser ────────────────────────────────────────────────────────────────────
# The Phase 90 script swirl — slow, deep, always on for the Eruption vibe.
[phaser]
enabled  = true
rate     = 0.28   # slow script sweep
depth    = 0.65   # deep swirl
feedback = 0.45   # resonant, vocal sweep
mix      = 0.40   # proudly present

# ── Delay ─────────────────────────────────────────────────────────────────────
# Echoplex slap: short single repeat for the cathedral bounce.
[delay]
enabled  = true
time     = 0.30   # ~150 ms slap
feedback = 0.25
mix      = 0.18

[reverb]
enabled = true
room = 0.35
damp = 0.50
mix  = 0.12
