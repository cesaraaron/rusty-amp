name        = "Pink Floyd — Comfortably Numb"
description = "Gilmour's singing lead: clean Hiwatt-style platform, Big Muff sustain, Binson-style repeats and hall wash. Let every bend breathe."

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Gentle — the Muff hisses, but the gate must never eat a fading bend.
[noise_gate]
enabled   = true
threshold = 0.12
release   = 0.45   # slow — bends decay naturally

# ── Compressor ────────────────────────────────────────────────────────────────
# Always-on Gilmour squeeze — evens the attack so the Muff sustains forever.
[compressor]
enabled = true
sustain = 0.50   # firm — infinite, singing sustain
attack  = 0.35   # pick attack still speaks
level   = 0.55

# ── Fuzz ──────────────────────────────────────────────────────────────────────
# The Ram's Head soul of this preset: thick violin sustain into repeats.
[fuzz]
enabled = true
fuzz  = 0.72   # high — endless sustain, smooth top
tone  = 0.55   # balanced — cuts without harshness
level = 0.62

# TS off — the Muff is the only dirt here.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Amp ───────────────────────────────────────────────────────────────────────
# Marshall run clean-ish as a Hiwatt DR103 stand-in: low gain, wide and
# glassy EQ, headroom for the Muff to bloom into. Mids present — Gilmour
# leads are fat, never scooped.
[amp]
model  = "marshall"
gain   = 0.30   # clean platform — the fuzz makes the sustain, not the amp
bass   = 0.52
mid    = 0.58   # fat mids — the violin voice
treble = 0.58
presence = 0.48
master = 0.62

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Orange 4×12 for the big closed-back bloom; ribbon blend + room for the
# Pulse-era depth. (Pair with a Fane-loaded IR via I for the full Hiwatt.)
[cabinet]
model     = "orange"
mic_pos   = 0.45   # just off-axis — smooth, no spit
mic_blend = 0.35   # ribbon warmth on the Muff's top end
mic_room  = 0.30   # generous air — the arena breathes

[eq]
enabled = true
low  = 0.48   # trim the Muff's low-end wool slightly
mid  = 0.55   # reinforce the singing band
high = 0.52

# ── Chorus ────────────────────────────────────────────────────────────────────
# Subtle Electric Mistress-style swirl under the lead.
[chorus]
enabled  = true
rate     = 0.20   # slow sweep
depth    = 0.45
mix      = 0.25   # mist, not wash

# ── Delay ─────────────────────────────────────────────────────────────────────
# Binson-style repeats: medium time, several repeats melting into the hall.
[delay]
enabled  = true
time     = 0.55   # ~275 ms — the Comfortably spacing
feedback = 0.42   # several repeats blooming behind each phrase
mix      = 0.28   # proudly audible — the delay IS the tone

[reverb]
enabled = true
room = 0.55
damp = 0.50
mix  = 0.22
